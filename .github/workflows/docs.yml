name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # AI modified: explicit names keep Pages checks recognizable in deployment history.
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    # AI modified: configure-pages reads site metadata, while build dependencies receive no write or OIDC access.
    permissions:
      contents: read
      pages: read # Reads the configured Pages site metadata.
    steps:
      # AI modified: manual documentation deployments must use the reviewed main branch.
      - name: Validate deployment ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Documentation deployment requires refs/heads/main." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # AI modified: documentation builds do not need authenticated Git access.
          persist-credentials: false
      # AI modified: keep pnpm version sourced only from packageManager.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      # AI modified: documentation deploys must satisfy the same quality gates as accepted package changes.
      - run: pnpm audit --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run coverage
      - run: pnpm run build
        env:
          DOCS_BASE: /gaudio/
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # AI modified: E2E previews the verified Pages artifact instead of rebuilding documentation.
      - run: pnpm --filter @gaudio/docs e2e
        env:
          DOCS_BASE: /gaudio/
          DOCS_E2E_USE_EXISTING_BUILD: "true"
      # AI modified: deployed-doc verification keeps browser diagnostics independently of the Pages artifact.
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-playwright
          path: |
            output/playwright/report
            output/playwright/results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    # AI modified: only the deployment job can publish Pages and request its identity token.
    permissions:
      pages: write # Publishes the verified Pages artifact.
      id-token: write # Authenticates the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    name: Smoke deployed documentation
    needs: deploy
    runs-on: ubuntu-latest
    # AI modified: the post-deployment probe only reads the committed smoke script and public Pages origin.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Smoke deployed Pages origin
        run: node apps/docs/scripts/smoke-deployed-site.mjs "$DEPLOYED_PAGE_URL"
        env:
          DEPLOYED_PAGE_URL: ${{ needs.deploy.outputs.page_url }}

name: Release package

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with.
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: Run all release checks without uploading to npm.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-gaudio
  cancel-in-progress: false

jobs:
  # AI modified: explicit names keep protected release checks understandable to maintainers.
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release_metadata.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # AI modified: release verification reads Git history but never writes through checkout credentials.
          persist-credentials: false
      # AI modified: keep pnpm version sourced only from packageManager.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # AI modified: dry runs validate main while real uploads must come from the matching version tag.
      - name: Validate release metadata
        id: release_metadata
        run: |
          package_version=$(node -p "require('./packages/gaudio/package.json').version")
          expected_tag="v${package_version}"

          # AI modified: dry runs may inspect truthful unreleased notes, but uploads require a dated first release section.
          PACKAGE_VERSION="$package_version" DRY_RUN="$DRY_RUN" node packages/gaudio/scripts/validate-release-changelog.mjs

          if [ "$DRY_RUN" = "true" ]; then
            if ! { [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" = "main" ]; } \
              && ! { [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "$expected_tag" ]; }; then
              echo "A release dry run requires main or workflow ref $expected_tag." >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Publishing requires workflow ref $expected_tag." >&2
            exit 1
          fi

          # AI modified: signed and annotated tags are tag objects; lightweight tags are rejected.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_object_type=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
            if [ "$tag_object_type" != "tag" ]; then
              echo "Release ref $GITHUB_REF_NAME must be an annotated or signed tag." >&2
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release ref must point to a commit on main." >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]] && [ "$NPM_TAG" = "latest" ]; then
            echo "A prerelease version cannot be published with the latest dist-tag." >&2
            exit 1
          fi

          # AI modified: only an explicit registry 404 proves that the version is available to publish.
          npm_view_output=""
          if npm_view_output=$(npm view "gaudio@${package_version}" version --json 2>&1); then
            echo "gaudio@${package_version} already exists on npm." >&2
            exit 1
          elif printf '%s\n' "$npm_view_output" | grep -Eq '"code":[[:space:]]*"E404"|npm error code E404'; then
            :
          else
            printf '%s\n' "$npm_view_output" >&2
            echo "Unable to verify whether gaudio@${package_version} already exists on npm." >&2
            exit 1
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NPM_TAG: ${{ inputs.npm_tag }}
      - run: pnpm install --frozen-lockfile
      # AI modified: prevent newly introduced high-severity dependency advisories from reaching a release.
      - run: pnpm audit --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run coverage
      - run: pnpm run build
      # AI modified: release verification covers Chromium, Firefox, and WebKit projects.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # AI modified: core media regressions run independently of documentation UI tests.
      - run: pnpm run test:browser:core
      - run: pnpm run e2e
        env:
          DOCS_E2E_USE_EXISTING_BUILD: "true"
      # AI modified: release reviewers retain browser evidence even when a flaky first attempt passes on retry.
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright
          path: |
            output/playwright/report
            output/playwright/results
            output/playwright/core-report
            output/playwright/core-results
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm --filter gaudio run pack:dry-run
      # AI modified: publish and compatibility jobs share one immutable package artifact.
      - name: Pack package artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm --filter gaudio pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
      # AI modified: exercise installed peers and both TypeScript module conditions at the supported compiler floor and current version.
      - name: Verify complete package consumption
        run: | # zizmor: ignore[adhoc-packages] A clean external consumer must install the packed artifact outside the workspace lockfile.
          set -euo pipefail
          consumer_directory=$(mktemp -d)
          package_archives=("$GITHUB_WORKSPACE"/artifacts/gaudio-*.tgz)
          if [ "${#package_archives[@]}" -ne 1 ] || [ ! -f "${package_archives[0]}" ]; then
            echo "Expected exactly one packed gaudio archive." >&2
            exit 1
          fi
          package_archive="${package_archives[0]}"
          hls_peer=$(node -p "require('./packages/gaudio/package.json').peerDependencies['hls.js']")
          dash_peer=$(node -p "require('./packages/gaudio/package.json').peerDependencies.dashjs")
          typescript_current_version=$(node -p "require('./packages/gaudio/node_modules/typescript/package.json').version")

          cd "$consumer_directory"
          npm init --yes
          npm install "$package_archive" "hls.js@${hls_peer}" "dashjs@${dash_peer}" \
            "typescript-minimum@npm:typescript@5.8.3" \
            "typescript-current@npm:typescript@${typescript_current_version}" \
            --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/packages/gaudio/scripts/verify-package-consumer.mjs" .
          cp "$GITHUB_WORKSPACE/packages/gaudio/scripts/verify-package-consumer-types.mts" .
          cp "$GITHUB_WORKSPACE/packages/gaudio/scripts/verify-package-consumer-types.cts" .
          GAUDIO_EXPECT_OPTIONAL_PEERS=true node verify-package-consumer.mjs
          for typescript_package in typescript-minimum typescript-current; do
            typescript_compiler="./node_modules/${typescript_package}/bin/tsc"
            # AI modified: release declarations must pass every advertised resolver before the immutable tarball can publish.
            node "$typescript_compiler" --noEmit --strict --skipLibCheck false \
              --target ES2022 --lib ES2022,DOM,DOM.Iterable \
              --module Node16 --moduleResolution Node16 \
              verify-package-consumer-types.mts verify-package-consumer-types.cts
            node "./node_modules/${typescript_package}/bin/tsc" --noEmit --strict --skipLibCheck false \
              --target ES2022 --lib ES2022,DOM,DOM.Iterable \
              --module NodeNext --moduleResolution NodeNext \
              verify-package-consumer-types.mts verify-package-consumer-types.cts
            node "$typescript_compiler" --noEmit --strict --skipLibCheck false \
              --target ES2022 --lib ES2022,DOM,DOM.Iterable \
              --module ESNext --moduleResolution Bundler \
              verify-package-consumer-types.mts verify-package-consumer-types.cts
          done
      # AI modified: every release candidate exercises npm's publish path against the exact immutable tarball.
      - name: Verify npm publish tarball
        run: |
          set -euo pipefail
          package_archives=("$GITHUB_WORKSPACE"/artifacts/gaudio-*.tgz)
          if [ "${#package_archives[@]}" -ne 1 ] || [ ! -f "${package_archives[0]}" ]; then
            echo "Expected exactly one packed gaudio archive." >&2
            exit 1
          fi
          package_archive="${package_archives[0]}"
          npm publish "$package_archive" --access public --tag "$NPM_TAG" --dry-run --ignore-scripts
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gaudio-package
          path: artifacts/gaudio-*.tgz
          if-no-files-found: error

  node-compatibility:
    name: Verify Node 18 package consumption
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # AI modified: compatibility checks only copy verifier files from the checkout.
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gaudio-package
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18
      # AI modified: verify Node 18 against public exports from the packed artifact only.
      - name: Verify Node 18 package consumption
        run: | # zizmor: ignore[adhoc-packages] A clean external consumer must install the packed artifact outside the workspace lockfile.
          set -euo pipefail
          consumer_directory=$(mktemp -d)
          package_archives=("$GITHUB_WORKSPACE"/artifacts/gaudio-*.tgz)
          if [ "${#package_archives[@]}" -ne 1 ] || [ ! -f "${package_archives[0]}" ]; then
            echo "Expected exactly one packed gaudio archive." >&2
            exit 1
          fi
          package_archive="${package_archives[0]}"
          cd "$consumer_directory"
          npm init --yes
          npm install "$package_archive" --omit=optional --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/packages/gaudio/scripts/verify-package-consumer.mjs" .
          node verify-package-consumer.mjs

  publish:
    name: Publish package
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: npm
    # AI modified: only a real npm upload can request the provenance identity token.
    permissions:
      contents: read
      id-token: write # Attests npm provenance for the verified artifact.
    needs:
      - verify
      - node-compatibility
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gaudio-package
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # AI modified: fail clearly before an upload when the protected npm credential is absent.
      - name: Validate npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is required to publish gaudio." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # AI modified: upload the already verified tarball with npm provenance.
      - name: Publish package
        run: |
          set -euo pipefail
          package_archives=("$GITHUB_WORKSPACE"/artifacts/gaudio-*.tgz)
          if [ "${#package_archives[@]}" -ne 1 ] || [ ! -f "${package_archives[0]}" ]; then
            echo "Expected exactly one packed gaudio archive." >&2
            exit 1
          fi
          package_archive="${package_archives[0]}"
          npm publish "$package_archive" --access public --tag "$NPM_TAG" --provenance --ignore-scripts
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-published:
    name: Verify published package
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    # AI modified: published-package checks run without the npm environment, registry secret, or OIDC permission.
    permissions:
      contents: read
    needs:
      - verify
      - publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # AI modified: prove that the uploaded version can be installed from npm without exposing publish authority.
      - name: Verify published package from npm
        run: | # zizmor: ignore[adhoc-packages] A clean external consumer must install the published artifact outside the workspace lockfile.
          set -euo pipefail
          package_version="$PACKAGE_VERSION"
          consumer_directory=$(mktemp -d)

          for attempt in {1..12}; do
            if npm view "gaudio@${package_version}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "gaudio@${package_version} did not become visible on npm." >&2
              exit 1
            fi
            sleep 5
          done

          cd "$consumer_directory"
          npm init --yes
          npm install "gaudio@${package_version}" --omit=optional --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/packages/gaudio/scripts/verify-package-consumer.mjs" .
          node verify-package-consumer.mjs
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
